name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup JDK 17
      # IMPORTANT:
      # No Gradle cache here because the Android
      # project may be inside a ZIP file.
      # ==========================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. Setup Gradle
      # ==========================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # ==========================================
      # 4. Find Android Project
      # ==========================================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Searching for Android Gradle project..."
          echo "=========================================="

          PROJECT_DIR=""

          # --------------------------------------
          # Check project directly in repository
          # --------------------------------------
          SETTINGS_FILE=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            | head -n 1 || true)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")

            echo ""
            echo "Android project found directly:"
            echo "$PROJECT_DIR"
          fi

          # --------------------------------------
          # If not found, search ZIP files
          # --------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "Android project not found directly."
            echo "Searching ZIP files..."

            ZIP_FILE=$(find . \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              | head -n 1 || true)

            if [ -z "$ZIP_FILE" ]; then
              echo ""
              echo "ERROR: No ZIP file found."
              echo ""
              echo "Repository contents:"
              find . -maxdepth 4 -type f | sort

              exit 1
            fi

            echo ""
            echo "ZIP found:"
            echo "$ZIP_FILE"

            # ------------------------------------
            # Extract ZIP
            # ------------------------------------
            rm -rf extracted-project
            mkdir -p extracted-project

            echo ""
            echo "Extracting ZIP..."

            unzip -o "$ZIP_FILE" -d extracted-project

            # ------------------------------------
            # Find settings.gradle after extraction
            # ------------------------------------
            SETTINGS_FILE=$(find extracted-project \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -n 1 || true)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")

              echo ""
              echo "Android project found:"
              echo "$PROJECT_DIR"
            fi
          fi

          # ======================================
          # Verify project
          # ======================================
          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "ERROR: Android Gradle project could not be found."
            echo ""
            echo "Files found in repository:"
            find . -maxdepth 6 -type f | sort | head -n 500

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "Checking Android project..."
          echo "=========================================="

          # Check settings.gradle
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then

            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          # Check app directory
          if [ ! -d "$PROJECT_DIR/app" ]; then

            echo "ERROR: app directory not found."
            echo ""
            echo "Project directory:"
            echo "$PROJECT_DIR"

            exit 1
          fi

          # Check app Gradle file
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then

            echo "ERROR: app/build.gradle not found."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "ANDROID PROJECT FOUND"
          echo "=========================================="
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "=========================================="

          # Save project path for next steps
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 5. Build Debug APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Building Android APK"
          echo "=========================================="

          cd "$PROJECT_DIR"

          echo ""
          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          # --------------------------------------
          # Use Gradle Wrapper if available
          # --------------------------------------
          if [ -f "./gradlew" ]; then

            echo ""
            echo "Gradle Wrapper found."

            chmod +x ./gradlew

            ./gradlew --version

            ./gradlew assembleDebug --stacktrace

          else

            echo ""
            echo "Gradle Wrapper not found."
            echo "Using Gradle 8.10.2."

            gradle --version

            gradle assembleDebug --stacktrace

          fi

      # ==========================================
      # 6. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Searching for APK..."
          echo "=========================================="

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then

            echo ""
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build output:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "APK FOUND"
          echo "=========================================="
          echo "$APK"
          echo "=========================================="

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ==========================================
      # 7. Upload APK
      # ==========================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AmarOvertime-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      # ==========================================
      # 8. Build Summary
      # ==========================================
      - name: Build Summary
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       AMAR OVERTIME BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "Android project:"
          echo "$PROJECT_DIR"
          echo ""
          echo "APK:"
          echo "$APK_PATH"
          echo ""
          echo "APK artifact:"
          echo "AmarOvertime-debug-apk"
          echo ""
          echo "=========================================="
